[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blitzgsea"
version = "0.0.2"
description = "Fast and accurate Gene Set Enrichment Analysis using gamma distribution approximation."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "James Hayhurst", email = "jhayhurst@ebi.ac.uk" }]
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "scikit-learn",
    "tqdm",
    "statsmodels",
    "mpmath",
    "matplotlib",
    "scipy",
    "polars>=1.36.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
blitzgsea = ["data/config.json", "data/KEGG_2021_Human"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
]
