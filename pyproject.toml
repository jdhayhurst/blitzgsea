[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blitzgsea"
version = "1.3.53"
description = "Fast and accurate Gene Set Enrichment Analysis using gamma distribution approximation."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Alexander Lachmann", email = "alexander.lachmann@mssm.edu" }]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.1.5",
    "numpy",
    "scikit-learn",
    "tqdm",
    "statsmodels",
    "mpmath",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
blitzgsea = ["data/config.json", "data/KEGG_2021_Human"]

[tool.pytest.ini_options]
testpaths = ["tests"]
